rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >
      60 s by default, configurable from 30 s (the public endpoint allows one
      request every 30 s per IP) to 600 s. One request serves every stop.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration has no third-party Python requirements.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide any condition.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any trigger.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >
      Stops are picked from the embedded GTFS index and the realtime endpoint
      is public and keyless, so there is no credential or host to validate.
      The bike flow reads the GBFS feed and reports cannot_connect.
  test-before-setup:
    status: exempt
    comment: >
      The shared endpoint is rate-limited to one request every 30 s; failing
      or retrying the setup on a transient 429 would make entries flap. The
      coordinator keeps polling and serves the last known data instead.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The data sources are public and keyless; there is nothing to re-authenticate.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud service for a single network; nothing to discover locally.
  discovery:
    status: exempt
    comment: Cloud service for a single network; nothing to discover locally.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration is a service; it does not support physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each entry tracks a single stop or station chosen by the user.
  entity-category:
    status: exempt
    comment: Every entity is a primary entity; none is diagnostic or configuration.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is the main data point of its stop or station.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: done
    comment: >
      No third-party dependency; HTTP goes through aiohttp and every blocking
      call (XML/JSON parsing, SQLite, file reads) runs in the executor.
  inject-websession: done
  strict-typing:
    status: todo
    comment: >
      mypy --strict passes except for the voluptuous schemas: recent Home Assistant
      releases type their APIs with probatio, so they only type-check once the
      integration drops support for older versions and switches to probatio.
