get_departures:
    fields:
        config_entry_id:
            required: true
            selector:
                config_entry:
                    integration: naolib
        lines:
            example: "['C3', '2']"
            selector:
                text:
                    multiple: true
        direction:
            selector:
                select:
                    options:
                        - value: "1"
                          label: "1"
                        - value: "2"
                          label: "2"
        walk_time:
            default: 0
            selector:
                number:
                    min: 0
                    max: 60
                    unit_of_measurement: min
                    mode: box
        limit:
            selector:
                number:
                    min: 1
                    max: 50
                    mode: box
