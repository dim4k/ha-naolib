[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# The generator is a standalone CLI script: it prints progress and is not a package.
"scripts/*" = ["INP001", "T201"]
"tests/*" = ["SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The integration is imported as `custom_components.naolib` from the repo root.
pythonpath = ["."]
