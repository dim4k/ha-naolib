name: CI

on:
    push:
    pull_request:

jobs:
    python:
        name: Python
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff -r requirements_test.txt

            - name: Ruff lint
              run: ruff check --output-format=github .

            - name: Ruff format
              run: ruff format --check .

            - name: Tests
              run: pytest

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Fail if the committed bundles are stale
              run: git diff --exit-code -- custom_components/naolib/www
